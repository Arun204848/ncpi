
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thank You | Application Received</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .thankyou-box {
            background: #ffffff;
            width: 100%;
            max-width: 520px;
            text-align: center;
            padding: 45px 30px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.10);
        }

        .check {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #28a745;
            color: #fff;
            font-size: 45px;
            line-height: 75px;
        }

        h1 {
            margin: 0 0 15px;
            font-size: 30px;
            color: #222;
        }

        p {
            margin: 0 auto 25px;
            color: #666;
            font-size: 16px;
            line-height: 1.6;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px 20px;
            margin: 12px 0;
            border-radius: 6px;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            transition: 0.2s;
        }

        .call-btn {
            background: #28a745;
            color: #fff;
        }

        .call-btn:hover {
            background: #218838;
        }

        .home-btn {
            background: #222;
            color: #fff;
        }

        .home-btn:hover {
            background: #000;
        }

        .note {
            margin-top: 20px;
            font-size: 13px;
            color: #888;
        }
    </style>
</head>

<body>

    <div class="thankyou-box">

        <div class="check">✓</div>

        <h1>Thank You!</h1>

        <p>
            Your application has been submitted successfully.

        </p>

        <!-- Replace phone number -->
        <a href="tel:+919830195548" class="btn call-btn">
            📞 Call Us Now
        </a>

        <a href="index.html" class="btn home-btn">
            ← Back to Home
        </a>

        <div class="note">
            If your enquiry is urgent, please call us directly.
        </div>

    </div>

</body>
</html>
